<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>경기지점 대리점 찾기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
}

/* 헤더 */
.header {
  background: linear-gradient(135deg, #03C75A 0%, #02a84b 100%);
  color: white;
  padding: 20px 16px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(3,199,90,0.35);
}
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 12px; opacity: 0.85; margin-top: 3px; }

/* GPS 영역 */
.gps-section {
  padding: 14px 16px;
  background: white;
  border-bottom: 1px solid #e8eaed;
}
.gps-btn {
  width: 100%;
  padding: 13px;
  background: #03C75A;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.gps-btn:active { transform: scale(0.98); }
.gps-btn.loading { background: #94a3b8; pointer-events: none; }
.gps-btn.done { background: #0284c7; }
.location-info {
  display: none;
  margin-top: 9px;
  padding: 9px 12px;
  background: #f0fdf4;
  border-radius: 8px;
  border: 1px solid #bbf7d0;
  font-size: 12px;
  color: #065f46;
}
.location-info.show { display: block; }

/* 검색/필터 */
.filter-section {
  padding: 10px 16px;
  background: white;
  border-bottom: 1px solid #e8eaed;
  display: flex;
  gap: 8px;
  align-items: center;
}
.search-box {
  flex: 1;
  padding: 10px 13px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  background: #fafafa;
}
.search-box:focus { border-color: #03C75A; background: white; }

/* 지역 필터 탭 */
.region-filter {
  padding: 10px 16px;
  background: white;
  border-bottom: 1px solid #e8eaed;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.region-filter::-webkit-scrollbar { display: none; }
.region-tab {
  padding: 6px 13px;
  border-radius: 20px;
  border: 1.5px solid #e2e8f0;
  background: white;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  color: #64748b;
  transition: all 0.15s;
}
.region-tab.active {
  background: #03C75A;
  border-color: #03C75A;
  color: white;
}

/* 결과 헤더 */
.result-bar {
  padding: 9px 16px;
  background: #f8fafc;
  border-bottom: 1px solid #e8eaed;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #64748b;
}
.result-bar strong { color: #03C75A; }
.dist-notice {
  display: none;
  font-size: 11px;
  color: #f59e0b;
}
.dist-notice.show { display: block; }

/* 카드 리스트 */
.branch-list {
  padding: 10px 16px 80px;
}
.branch-card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  animation: fadeIn 0.25s ease;
  border: 1px solid transparent;
  transition: border-color 0.2s;
}
.branch-card.near-1 { border-color: #fbbf24; }
.branch-card.near-2 { border-color: #94a3b8; }
.branch-card.near-3 { border-color: #cd7c54; }
@keyframes fadeIn { from{ opacity:0;transform:translateY(5px); } to{ opacity:1;transform:translateY(0); } }

/* 카드 상단 */
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 9px;
}
.rank-badge {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.rank-1 { background: #fbbf24; color: white; }
.rank-2 { background: #94a3b8; color: white; }
.rank-3 { background: #cd7c54; color: white; }
.rank-n { background: #f1f5f9; color: #64748b; }

.name-area { flex: 1; min-width: 0; }
.card-name {
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
  line-height: 1.4;
  word-break: keep-all;
}
.card-manager {
  font-size: 12px;
  color: #64748b;
  margin-top: 3px;
}
.card-manager span { color: #03C75A; font-weight: 600; }

.card-dist {
  flex-shrink: 0;
  text-align: right;
}
.dist-value {
  font-size: 16px;
  font-weight: 800;
  color: #03C75A;
  line-height: 1;
}
.dist-label { font-size: 10px; color: #94a3b8; margin-top: 2px; }
.dist-unknown { font-size: 12px; color: #cbd5e1; }

/* 태그 */
.card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.tag {
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -0.2px;
}
.tag-region { background: #eff6ff; color: #3b82f6; }
.tag-city { background: #f0fdf4; color: #16a34a; }

/* 주소 */
.card-address {
  font-size: 12px;
  color: #64748b;
  line-height: 1.5;
  margin-bottom: 10px;
}

/* 실적 */
.perf-row {
  display: flex;
  gap: 6px;
  margin-bottom: 11px;
}
.perf-box {
  flex: 1;
  background: #f8fafc;
  border-radius: 9px;
  padding: 8px 10px;
  text-align: center;
  border: 1px solid #e2e8f0;
}
.perf-label {
  font-size: 10px;
  color: #94a3b8;
  font-weight: 600;
  margin-bottom: 3px;
}
.perf-value {
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
}
.perf-value.highlight { color: #03C75A; }

/* 액션 버튼 */
.card-actions {
  display: flex;
  gap: 7px;
}
.btn-car {
  flex: 1;
  padding: 11px 8px;
  background: #03C75A;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: background 0.15s;
}
.btn-car:active { background: #02a84b; }
.btn-icon {
  padding: 11px 13px;
  border-radius: 10px;
  border: 1.5px solid #e2e8f0;
  background: white;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  line-height: 1;
}
.btn-icon.walk { background: #f0fdf4; border-color: #bbf7d0; }
.btn-icon.transit { background: #eff6ff; border-color: #bfdbfe; }
.btn-icon:active { opacity: 0.7; }

/* 빈 상태 */
.empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
.empty .ico { font-size: 44px; margin-bottom: 12px; }

/* 상단 버튼 */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 18px;
  width: 42px;
  height: 42px;
  background: rgba(30,41,59,0.85);
  backdrop-filter: blur(8px);
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 0.2s;
}
.scroll-top.show { display: flex; }
</style>
</head>

<div class="header">
  <h1>📍 경기지점 대리점 찾기</h1>

let userLat = null, userLng = null;
let selectedRegion = '전체';

// 지역 탭 생성
const regions = ['전체', ...new Set(BRANCHES.map(b => b.addr2))];
const rf = document.getElementById('regionFilter');
regions.forEach(r => {
  const btn = document.createElement('button');
  btn.className = 'region-tab' + (r === '전체' ? ' active' : '');
  btn.textContent = r;
  btn.onclick = () => {
    selectedRegion = r;
    document.querySelectorAll('.region-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  };
  rf.appendChild(btn);
});

function haversine(a, b, c, d) {
  const R = 6371, dA = (c-a)*Math.PI/180, dB = (d-b)*Math.PI/180;
  const x = Math.sin(dA/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function getLocation() {
  const btn = document.getElementById('gpsBtn');
  btn.className = 'gps-btn loading';
  btn.innerHTML = '<span>⏳</span> 위치 확인 중...';
  if (!navigator.geolocation) { alert('위치 기능 미지원 브라우저예요.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    btn.className = 'gps-btn done';
    btn.innerHTML = '<span>✅</span> 위치 확인됨 · 다시 확인';
    const info = document.getElementById('locationInfo');
    info.className = 'location-info show';
    info.innerHTML = `📌 위도 ${userLat.toFixed(5)} / 경도 ${userLng.toFixed(5)}`;
    document.getElementById('distNotice').className = 'dist-notice show';
    renderList();
  }, err => {
    alert(err.code === 1 ? '위치 권한을 허용해 주세요.' : '위치를 가져올 수 없어요.');
    btn.className = 'gps-btn';
    btn.innerHTML = '<span>📡</span> 내 현재 위치 확인하기';
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}

function openNaver(addr, name, type) {
  const a = encodeURIComponent(addr), n = encodeURIComponent(name);
  const scheme = type === 'walk' ? 'walk' : type === 'transit' ? 'public' : 'car';
  const appUrl = `nmap://route/${scheme}?daddr=${a}&dname=${n}&appname=gyeonggi.branch.finder`;
  const webUrl = `https://m.map.naver.com/directions/index.naver?menu=route&ename=${n}&eaddr=${a}`;
  const t = setTimeout(() => window.open(webUrl,'_blank'), 1200);
  const f = document.createElement('iframe');
  f.style.display='none'; document.body.appendChild(f);
  f.src = appUrl;
  setTimeout(() => document.body.removeChild(f), 2000);
}

function fmtDist(km) {
  return km < 1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km';
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = BRANCHES
    .filter(b => selectedRegion === '전체' || b.addr2 === selectedRegion)
    .filter(b => !q || b.name.toLowerCase().includes(q) || b.address.toLowerCase().includes(q) || b.region.includes(q) || b.addr2.includes(q))
    .map(b => ({...b, dist: userLat !== null ? haversine(userLat, userLng, b.lat, b.lng) : null}));

  if (userLat !== null) list.sort((a,b) => (a.dist??9999)-(b.dist??9999));

  document.getElementById('countNum').textContent = list.length;

  const cont = document.getElementById('branchList');
  if (!list.length) {
    cont.innerHTML = `<div class="empty"><div class="ico">🔍</div><p>검색 결과가 없어요</p></div>`;
    return;
  }

  cont.innerHTML = list.map((b, i) => {
    const rClass = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
    const cardBorder = i===0?'near-1':i===1?'near-2':i===2?'near-3':'';
    const distHtml = b.dist !== null
      ? `<div class="card-dist"><div class="dist-value">${fmtDist(b.dist)}</div><div class="dist-label">거리(지역중심)</div></div>`
      : `<div class="card-dist"><div class="dist-unknown">위치미확인</div></div>`;
    const safeAddr = b.address.replace(/'/g,"\'");
    const safeName = b.name.replace(/'/g,"\'");
    return `
<div class="branch-card ${cardBorder}">
  <div class="card-top">
    <div class="rank-badge ${rClass}">${i+1}</div>
    <div class="name-area">
      <div class="card-name">${b.name}</div>
      <div class="card-manager">매핑매니저 <span>${b.manager}</span></div>
    </div>
    ${distHtml}
  </div>
  <div class="card-tags">
    <span class="tag tag-region">${b.region}</span>
    <span class="tag tag-city">📍 ${b.addr2}</span>
  </div>
  <div class="card-address">🏢 ${b.address}</div>
  <div class="perf-row">
    <div class="perf-box">
      <div class="perf-label">기준실적</div>
      <div class="perf-value">${b.perf_base}</div>
    </div>
    <div class="perf-box">
      <div class="perf-label">7월실적</div>
      <div class="perf-value highlight">${b.perf_jul}</div>
    </div>
    <div class="perf-box">
      <div class="perf-label">26年上</div>
      <div class="perf-value">${b.perf_26h}</div>
    </div>
    <div class="perf-box">
      <div class="perf-label">재적</div>
      <div class="perf-value">${b.members}</div>
    </div>
  </div>
  <div class="card-actions">
    <button class="btn-car" onclick="openNaver('${safeAddr}','${safeName}','car')">🚗 네이버지도 내비</button>
    <button class="btn-icon walk" onclick="openNaver('${safeAddr}','${safeName}','walk')" title="도보">🚶</button>
    <button class="btn-icon transit" onclick="openNaver('${safeAddr}','${safeName}','transit')" title="대중교통">🚌</button>
  </div>
</div>`;
  }).join('');
}

window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').className = 'scroll-top' + (window.scrollY > 300 ? ' show' : '');
});

renderList();
</script>
</body>
</html>
